name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: nothing here talks to a database or external API at build/test time.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test
      - name: Migrations match schema
        run: |
          npx drizzle-kit generate --name ci_check > /tmp/generate.log 2>&1 || (cat /tmp/generate.log; exit 1)
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Build
        run: npm run build
